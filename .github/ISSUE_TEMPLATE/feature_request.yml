name: Предложение
description: Идея, доработка или новый инструмент
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Опишите рабочую ситуацию, а не только функцию.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Что предлагаете
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
