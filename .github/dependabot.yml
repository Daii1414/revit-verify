version: 2
updates:
  # Only minor and patch updates: a major bump of ModelContextProtocol or
  # System.Drawing.Common changes the public API and needs a manual migration.
  - package-ecosystem: nuget
    directory: "/src/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    version-update:
      versioning-strategy: increase-if-necessary
      allowed-versions: ">=8.0.0,<9.0.0"

  - package-ecosystem: nuget
    directory: "/src/plugin-r25"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    version-update:
      versioning-strategy: increase-if-necessary
      allowed-versions: ">=8.0.0,<9.0.0"

  - package-ecosystem: nuget
    directory: "/src/plugin-r26"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    version-update:
      versioning-strategy: increase-if-necessary
      allowed-versions: ">=8.0.0,<9.0.0"

  - package-ecosystem: nuget
    directory: "/tests/RvtMcp.Tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    version-update:
      versioning-strategy: increase-if-necessary
      allowed-versions: ">=8.0.0,<9.0.0"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
